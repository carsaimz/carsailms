name: Build e Publicar Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Dar permissão ao gradlew
        run: chmod +x gradlew

      - name: Decodificar keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_FILE: release.jks

      - name: Extrair versão
        id: version
        run: |
          VNAME=$(grep 'versionName' app/build.gradle | head -1 | awk -F '"' '{print $2}')
          VCODE=$(grep 'versionCode' app/build.gradle | head -1 | grep -oE '[0-9]+')
          echo "versionName=$VNAME" >> $GITHUB_OUTPUT
          echo "versionCode=$VCODE" >> $GITHUB_OUTPUT

      - name: Gerar changelog
        id: changelog
        run: |
          CURRENT_TAG=${{ github.ref_name }}
          CURRENT_VERSION=${{ steps.version.outputs.versionName }}
          CURRENT_BUILD=${{ steps.version.outputs.versionCode }}
          
          # Pega todas as tags ordenadas por data de criação
          ALL_TAGS=$(git tag --sort=-creatordate)
          
          # Acha a tag anterior com versão OU build diferente
          PREV_TAG=""
          for TAG in $ALL_TAGS; do
            if [ "$TAG" = "$CURRENT_TAG" ]; then continue; fi
            
            # Checkout temporário pra ler a versão da tag anterior
            git checkout $TAG -- app/build.gradle 2>/dev/null
            TAG_VNAME=$(grep 'versionName' app/build.gradle | head -1 | awk -F '"' '{print $2}')
            TAG_VCODE=$(grep 'versionCode' app/build.gradle | head -1 | grep -oE '[0-9]+')
            git restore app/build.gradle 2>/dev/null
            
            # Se versão ou build mudou, essa é a tag base
            if [ "$TAG_VNAME" != "$CURRENT_VERSION" ] || [ "$TAG_VCODE" != "$CURRENT_BUILD" ]; then
              PREV_TAG=$TAG
              break
            fi
          done
          
          # Gera log com autor
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s - _%an_" --no-merges)
          else
            LOG=$(git log --pretty=format:"- %s - _%an_" --no-merges ${PREV_TAG}..${CURRENT_TAG})
          fi
          
          # Se não tem commits novos, avisa
          if [ -z "$LOG" ]; then
            LOG="- Nenhuma alteração desde a última build"
          fi
          
          # Escape pra GitHub Output
          LOG="${LOG//'%'/'%25'}"
          LOG="${LOG//$'\n'/'%0A'}"
          LOG="${LOG//$'\r'/'%0D'}"
          echo "log=$LOG" >> $GITHUB_OUTPUT

      - name: Criar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "🚀 v${{ steps.version.outputs.versionName }} (Build ${{ steps.version.outputs.versionCode }})"
          body: |
            ### v${{ steps.version.outputs.versionName }} (Build ${{ steps.version.outputs.versionCode }})
            ${{ steps.changelog.outputs.log }}

            ---
            <div align="center">
            <a href="https://github.com/${{ github.repository }}/releases/latest/download/app-release.apk"><img src="https://img.shields.io/badge/BAIXAR-APK-brightgreen.svg" alt="Baixar APK" width="200"></a>
            <h3>Clique no botão acima para baixar!</h3>
            </div>

            ---
            <img width="1280" height="1280" alt="carsailms" src="https://github.com/user-attachments/assets/9988fa96-c7de-47cf-b68c-1d57845dae89" />

            **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}