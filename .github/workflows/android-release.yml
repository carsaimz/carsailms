name: Build e Publicar Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Dar permissão ao gradlew
        run: chmod +x gradlew

      - name: Decodificar keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_FILE: release.jks

      - name: Extrair versão
        id: version
        run: |
          VNAME=$(grep 'versionName' app/build.gradle | head -1 | awk -F '"' '{print $2}')
          VCODE=$(grep 'versionCode' app/build.gradle | head -1 | grep -oE '[0-9]+')
          echo "versionName=$VNAME" >> $GITHUB_OUTPUT
          echo "versionCode=$VCODE" >> $GITHUB_OUTPUT

      - name: Gerar changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${{ github.ref_name }}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- ✅ %s" --no-merges)
          else
            LOG=$(git log --pretty=format:"- ✅ %s" --no-merges ${PREV_TAG}..${{ github.ref_name }})
          fi
          LOG="${LOG//'%'/'%25'}"
          LOG="${LOG//$'\n'/'%0A'}"
          LOG="${LOG//$'\r'/'%0D'}"
          echo "log=$LOG" >> $GITHUB_OUTPUT

      - name: Criar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "🚀 v${{ steps.version.outputs.versionName }} (Build ${{ steps.version.outputs.versionCode }})"
          body: |
            ### v${{ steps.version.outputs.versionName }} (Build ${{ steps.version.outputs.versionCode }}) - $(date +%Y-%m-%d)
            ${{ steps.changelog.outputs.log }}

            ---
            <div align="center">
            <a href="https://github.com/${{ github.repository }}/releases/latest/download/app-release.apk"><img src="https://img.shields.io/badge/BAIXAR-APK-brightgreen.svg" alt="Baixar APK" width="200"></a>
            <h3>Clique no botão acima para baixar!</h3>
            </div>

            ---
            <img width="1280" height="1280" alt="carsailms" src="https://github.com/user-attachments/assets/9988fa96-c7de-47cf-b68c-1d57845dae89" />

            **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}