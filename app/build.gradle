plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.carsailms'
    compileSdk 34

    defaultConfig {
        applicationId "com.carsailms"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.0.2"

        multiDexEnabled true

        vectorDrawables {
            useSupportLibrary true
        }
    }

    // --- Assinatura ---
    signingConfigs {
        // Debug: usa a keystore padrão do Android (nunca sobe no repositório)
        debug {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }

        // Release: configurada dinamicamente abaixo
        release {
            // será preenchida via variáveis de ambiente ou fallback
        }
    }

    buildTypes {
        release {
            // A configuração de assinatura é definida no bloco dinâmico
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    // --- Configuração dinâmica da assinatura de release ---
    // Se as variáveis de ambiente (secrets) existirem → usa keystore real.
    // Caso contrário → usa a keystore de debug (para builds locais sem segredos).
    def keystorePassword = System.getenv("KEYSTORE_PASSWORD")
    def keyAlias          = System.getenv("KEY_ALIAS")
    def keyPassword       = System.getenv("KEY_PASSWORD")
    def keystoreFile      = System.getenv("KEYSTORE_FILE") ?: "release.jks"

    if (keystorePassword != null && keyAlias != null && keyPassword != null) {
        android.signingConfigs.release {
            storeFile file(keystoreFile)
            storePassword keystorePassword
            keyAlias keyAlias
            keyPassword keyPassword
        }
        android.buildTypes.release.signingConfig = android.signingConfigs.release
    } else {
        // Fallback para builds locais: assina com debug
        android.buildTypes.release.signingConfig = android.signingConfigs.debug
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    dexOptions {
        javaMaxHeapSize "256m"
        jumboMode = true
        keepRuntimeAnnotatedClasses = false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'androidx.preference:preference:1.2.1'

    implementation platform('com.google.firebase:firebase-bom:34.8.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-config'

    implementation 'androidx.multidex:multidex:2.0.1'
}
